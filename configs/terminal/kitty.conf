# Duckybox kitty theme
# Brand violet #4B0E8F · accent #7C3AED · backdrop #12071F
# Semi-transparent window (needs a compositor: Marco / KWin).

font_family      DejaVu Sans Mono
font_size        11.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# Window
remember_window_size  yes
initial_window_width  110c
initial_window_height 32c
window_padding_width  6
confirm_os_window_close 0
enable_audio_bell no

# Semi-transparent violet backdrop
background_opacity 0.82
dynamic_background_opacity no
background #12071F
foreground #EDE9FE
cursor     #A78BFA
cursor_text_color #12071F
selection_foreground #12071F
selection_background #7C3AED

# URL / chrome
url_color #60A5FA
active_border_color   #7C3AED
inactive_border_color #4C3A63
bell_border_color     #FBBF24

# Tab bar (when used)
tab_bar_edge bottom
tab_bar_style powerline
active_tab_foreground   #12071F
active_tab_background   #7C3AED
inactive_tab_foreground #C4B5FD
inactive_tab_background #4B0E8F

# 16-colour palette (same as mate-terminal / Konsole / OSC sequences)
color0  #12071F
color1  #FF5370
color2  #7CB342
color3  #FBBF24
color4  #60A5FA
color5  #A78BFA
color6  #22D3EE
color7  #EDE9FE
color8  #4C3A63
color9  #FF7A93
color10 #9CCC65
color11 #FCD34D
color12 #93C5FD
color13 #C4B5FD
color14 #67E8F9
color15 #FFFFFF

# Cursor
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 20000

# Wayland / X11
linux_display_server auto
