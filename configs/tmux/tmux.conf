# Duckybox tmux theme — violet accent (#7C3AED on brand #4B0E8F)

set-option -g default-command bash
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#4B0E8F,fg=#EDE9FE'
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[bg=#7C3AED,fg=#12071F,bold] DUCKYBOX #[bg=#4B0E8F,fg=#A78BFA] '
set -g status-right '#[fg=#EDE9FE]%Y-%m-%d #[fg=#A78BFA]%H:%M '

# Windows
setw -g window-status-style 'bg=#4B0E8F,fg=#C4B5FD'
setw -g window-status-current-style 'bg=#12071F,fg=#A78BFA,bold'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
setw -g window-status-activity-style 'bg=#4B0E8F,fg=#FCD34D'

# Panes
set -g pane-border-style 'fg=#2E1A47'
set -g pane-active-border-style 'fg=#7C3AED'
set -g message-style 'bg=#7C3AED,fg=#12071F'
set -g mode-style 'bg=#A78BFA,fg=#12071F'
set -g display-panes-active-colour '#7C3AED'
set -g display-panes-colour '#2E1A47'
