# Turfbox tmux theme — orange accent (#FF6A00)

set-option -g default-command bash
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#FF6A00,fg=#0D1117'
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[bold] Turfbox #[fg=#0D1117]| '
set -g status-right '#[fg=#0D1117]%Y-%m-%d %H:%M '

# Windows
setw -g window-status-style 'bg=#FF6A00,fg=#0D1117'
setw -g window-status-current-style 'bg=#0D1117,fg=#FF6A00,bold'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '

# Panes
set -g pane-border-style 'fg=#3D2A1A'
set -g pane-active-border-style 'fg=#FF6A00'
set -g message-style 'bg=#FF6A00,fg=#0D1117'
set -g mode-style 'bg=#FF8C1A,fg=#0D1117'
